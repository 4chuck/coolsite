<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.49">
    <title>Redirecting...</title>
    <style>
        /* Center the loader on the screen */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Keyframes for spinning animation */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Style for the message */
        h1 {
            text-align: center;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
        }
    </style>

    <!-- Preload resources for faster loading of redirect pages -->
    <!-- Cyborg page resources -->
    <link rel="preload" href="home/cyborg/vendor/bootstrap/css/bootstrap.min.css" as="style">
    <link rel="preload" href="home/cyborg/assets/css/templatemo-cyborg-gaming.css" as="style">
    <link rel="preload" href="home/cyborg/vendor/jquery/jquery.min.js" as="script">
    <link rel="preload" href="home/cyborg/vendor/bootstrap/js/bootstrap.min.js" as="script">
    <link rel="preload" href="home/cyborg/assets/js/custom.js" as="script">
    <!-- Scaffold page resources -->
    <link rel="preload" href="home/Scaffold/assets/vendor/bootstrap/css/bootstrap.min.css" as="style">
    <link rel="preload" href="home/Scaffold/assets/css/style2.css" as="style">
    <link rel="preload" href="home/Scaffold/assets/vendor/bootstrap/js/bootstrap.bundle.min.js" as="script">
    <link rel="preload" href="home/Scaffold/assets/js/main.js" as="script">

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js';
        import { firebaseConfig } from './home/config.js';
        import { ROUTES, redirectTo } from './home/routes.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence);

        function redirectToPage() {
            // Fast check: if we have a local session hint, redirect IMMEDIATELY
            if (localStorage.getItem('userUID')) {
                redirectTo('cyborgHome');
                return;
            }

            // Fallback to Firebase listener
            onAuthStateChanged(auth, user => {
                if (user) {
                    localStorage.setItem('name', user.displayName || 'Player');
                    localStorage.setItem('userUID', user.uid);
                    redirectTo('cyborgHome');
                } else {
                    redirectTo('scaffoldHome');
                }
            });

            // Safety timeout
            setTimeout(() => {
                if (!localStorage.getItem('userUID')) {
                    redirectTo('scaffoldHome');
                }
            }, 2000);
        }

        redirectToPage();
    </script>
</head>

<body>
    <div class="loader"></div>
    <h1>Redirecting, please wait...</h1>
</body>

</html>
