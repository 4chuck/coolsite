<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault | Tetron</title>
    
    <!-- Design System -->
    <link rel="stylesheet" href="../src/css/design-system.css">
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Crypto library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        .vault-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px 40px 20px;
        }

        .vault-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
        }

        .vault-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(var(--accent-rgb), 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .method-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .method-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-align: center;
        }

        .method-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: 'Inter', sans-serif;
            resize: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--accent);
            outline: none;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .vault-btn {
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-encrypt {
            background: var(--accent);
            color: white;
        }

        .btn-decrypt {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-encrypt:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(var(--accent-rgb), 0.4); }
        .btn-decrypt:hover { background: rgba(255, 255, 255, 0.15); }

        .result-area {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--glass-border);
            display: none;
        }

        .result-area.show { display: block; animation: fadeIn 0.5s ease; }

        .copy-btn {
            position: absolute;
            right: 15px;
            top: 45px;
            background: rgba(var(--accent-rgb), 0.2);
            border: none;
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="dashboard-layout">
    <!-- Navbar -->
    <header class="glass-navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo-brand">
                <i class="fas fa-cubes"></i> TETRON
            </a>
            
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../dashboard/index.html">Dashboard</a></li>
                <li><a href="../firebase/home/cyborg/index.html">Gaming</a></li>
                <li><a href="AES.html" class="active">Vault</a></li>
                <li><a href="camera.html">Camera</a></li>
            </ul>

            <div class="nav-actions">
                <button id="open-search-btn" class="icon-btn" title="Search"><i class="bi bi-search"></i></button>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="bi bi-sun"></i></button>
                <a href="../dashboard/index.html" class="user-profile">
                    <img id="nav-avatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--color-primary);">
                </a>
            </div>
        </div>
    </header>

    <main class="vault-container">
        <header class="page-header" style="text-align: center; margin-bottom: 40px;">
            <h1 class="gradient-text" style="font-size: 2.5rem;">Secure Encryption Vault</h1>
            <p style="color: var(--text-muted);">Military-grade encryption for your sensitive information.</p>
        </header>

        <div class="vault-card">
            <div class="input-group">
                <label>Encryption Algorithm</label>
                <div class="method-selector" id="methodSelector">
                    <div class="method-btn active" data-method="AES">AES</div>
                    <div class="method-btn" data-method="DES">DES</div>
                    <div class="method-btn" data-method="TripleDES">3DES</div>
                    <div class="method-btn" data-method="Rabbit">Rabbit</div>
                    <div class="method-btn" data-method="RC4">RC4</div>
                </div>
            </div>

            <div class="input-group">
                <label for="plaintext">Data to Process</label>
                <textarea id="plaintext" rows="5" placeholder="Enter your text or encrypted string here..."></textarea>
            </div>

            <div class="input-group">
                <label for="key">Master Secret Key</label>
                <div style="position: relative;">
                    <input type="text" id="key" placeholder="Enter your private encryption key...">
                    <i class="fas fa-key" style="position: absolute; right: 15px; top: 15px; color: var(--text-muted);"></i>
                </div>
            </div>

            <div class="action-btns">
                <button class="vault-btn btn-encrypt" onclick="process('encrypt')">
                    <i class="fas fa-lock"></i> Encrypt Data
                </button>
                <button class="vault-btn btn-decrypt" onclick="process('decrypt')">
                    <i class="fas fa-unlock"></i> Decrypt Data
                </button>
            </div>

            <div id="resultArea" class="result-area">
                <div class="input-group" style="position: relative;">
                    <label id="resultLabel">Output</label>
                    <button class="copy-btn" onclick="copyResult()">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                    <textarea id="resultOutput" rows="5" readonly></textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- Search Modal -->
    <div id="id03" class="modal-overlay">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
                <h3 style="color: var(--text-main);">Quick Search</h3>
                <button class="toast-close close" style="font-size:1.5rem; color: var(--text-muted);">&times;</button>
            </div>
            <div class="form-group">
                <input type="text" id="global-search-input" class="form-control" placeholder="Type a keyword..." autocomplete="off" style="width:100%; padding:15px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:white;">
            </div>
            <div class="text-muted" style="font-size:0.9rem;">
                Keywords: dog, cat, sketch, editor, vault, calci, ironman, dashboard
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, storage } from "../src/js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { initTheme } from "../src/js/theme.js";
        import { initSearch } from "../src/js/search.js";
        import { getOrFetchCachedProfileAvatar } from "../src/js/avatar.js";

        const avatarElem = document.getElementById('nav-avatar');

        // Initialize Platform Engines
        initTheme();
        initSearch();

        // Auth Protection
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "../login/fire-login.html";
                return;
            }
            if (!avatarElem) return;
            await getOrFetchCachedProfileAvatar(avatarElem, user, db, storage);
        });

        let currentMethod = 'AES';

        // Method Selection
        const btns = document.querySelectorAll('.method-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMethod = btn.dataset.method;
            });
        });

        // Processing Logic
        window.process = function(type) {
            const data = document.getElementById('plaintext').value;
            const key = document.getElementById('key').value;
            const resultArea = document.getElementById('resultArea');
            const resultOutput = document.getElementById('resultOutput');
            const resultLabel = document.getElementById('resultLabel');

            if (!data || !key) {
                alert("Please enter both the data and your secret key.");
                return;
            }

            let result;
            try {
                if (type === 'encrypt') {
                    result = CryptoJS[currentMethod].encrypt(data, key).toString();
                    resultLabel.textContent = "Encrypted Output";
                } else {
                    const bytes = CryptoJS[currentMethod].decrypt(data, key);
                    result = bytes.toString(CryptoJS.enc.Utf8);
                    resultLabel.textContent = "Decrypted Message";
                    
                    if (!result) throw new Error("Invalid key or corrupted data");
                }

                resultOutput.value = result;
                resultArea.classList.add('show');
            } catch (e) {
                alert("Processing failed: " + e.message);
            }
        };

        window.copyResult = function() {
            const output = document.getElementById('resultOutput');
            output.select();
            document.execCommand('copy');
            
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
            }, 2000);
        };
    </script>
</body>
</html>
