<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Camera | Tetron</title>
    
    <!-- Design System -->
    <link rel="stylesheet" href="../src/css/design-system.css">
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        .camera-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 20px 40px 20px;
        }

        .viewport-container {
            position: relative;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-2xl);
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect for selfie */
        }

        #video.environment {
            transform: scaleX(1);
        }

        .viewport-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.4) 100%);
        }

        .overlay-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .live-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ff4b2b;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .camera-controls {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .control-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }

        .shutter-btn {
            width: 80px;
            height: 80px;
            background: white;
            border: 6px solid rgba(var(--accent-rgb), 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .shutter-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        .shutter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4);
        }

        .shutter-btn:active {
            transform: scale(0.9);
        }

        .gallery-preview {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #111;
            border: 2px solid white;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-preview:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        #canvas { display: none; }

        .captured-tray {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .captured-item {
            background: var(--glass-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            aspect-ratio: 1/1;
            position: relative;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .captured-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .captured-item .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--accent);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-decoration: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .captured-item:hover .download-btn {
            opacity: 1;
        }
    </style>
</head>
<body class="dashboard-layout">
    <!-- Navbar -->
    <header class="glass-navbar">
        <div class="navbar-container">
            <a href="../index.html" class="logo-brand">
                <i class="fas fa-cubes"></i> TETRON
            </a>
            
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../dashboard/index.html">Dashboard</a></li>
                <li><a href="../firebase/home/cyborg/index.html">Gaming</a></li>
                <li><a href="AES.html">Vault</a></li>
                <li><a href="camera.html" class="active">Camera</a></li>
            </ul>

            <div class="nav-actions">
                <button id="open-search-btn" class="icon-btn" title="Search"><i class="bi bi-search"></i></button>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="bi bi-sun"></i></button>
                <a href="../dashboard/index.html" class="user-profile">
                    <img id="nav-avatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--color-primary);">
                </a>
            </div>
        </div>
    </header>

    <main class="camera-container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 class="gradient-text">Pro Studio Camera</h1>
            <p style="color: var(--text-muted);">Capture high-quality images directly to your dashboard.</p>
        </header>

        <div class="viewport-container">
            <video id="video" autoplay playsinline></video>
            <div class="viewport-overlay">
                <div class="overlay-top">
                    <div class="live-indicator">LIVE</div>
                    <div id="camera-label" style="font-size: 0.7rem; color: rgba(255,255,255,0.5);">FRONT CAMERA</div>
                </div>
                <div class="overlay-bottom" style="display:flex; justify-content: space-between; align-items: flex-end;">
                    <div style="color: rgba(255,255,255,0.3); font-size: 0.6rem;">ISO 100 | 1/125 | f/2.8</div>
                    <div style="color: rgba(255,255,255,0.3); font-size: 0.6rem;">REC-00:00:00</div>
                </div>
            </div>
        </div>

        <div class="camera-controls">
            <button class="control-btn" id="switchCameraBtn" title="Switch Camera">
                <i class="fas fa-camera-rotate"></i>
            </button>
            
            <button class="shutter-btn" id="captureBtn" title="Capture Photo"></button>
            
            <div class="gallery-preview" id="galleryPreview" title="View Latest Capture">
                <img id="latest-thumb" src="https://via.placeholder.com/60?text=Empty" alt="Latest">
            </div>
        </div>

        <div id="capturedTray" class="captured-tray">
            <!-- Photos appear here -->
        </div>

        <canvas id="canvas"></canvas>
    </main>

    <!-- Search Modal -->
    <div id="id03" class="modal-overlay">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
                <h3 style="color: var(--text-main);">Quick Search</h3>
                <button class="toast-close close" style="font-size:1.5rem; color: var(--text-muted);">&times;</button>
            </div>
            <div class="form-group">
                <input type="text" id="global-search-input" class="form-control" placeholder="Type a keyword..." autocomplete="off" style="width:100%; padding:15px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:white;">
            </div>
            <div class="text-muted" style="font-size:0.9rem;">
                Keywords: dog, cat, sketch, editor, vault, calci, ironman, dashboard
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from "../src/js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { initTheme } from "../src/js/theme.js";
        import { initSearch } from "../src/js/search.js";

        // Initialize Platform Engines
        initTheme();
        initSearch();

        // Auth Protection
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../login/fire-login.html";
            } else if (user.photoURL) {
                document.getElementById('nav-avatar').src = user.photoURL;
            }
        });

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const switchBtn = document.getElementById('switchCameraBtn');
        const tray = document.getElementById('capturedTray');
        const thumb = document.getElementById('latest-thumb');
        
        let facingMode = 'user';
        let stream = null;

        async function initCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;
                
                // Update mirror effect
                video.className = facingMode === 'user' ? '' : 'environment';
                document.getElementById('camera-label').textContent = 
                    facingMode === 'user' ? 'FRONT CAMERA' : 'REAR CAMERA';
            } catch (err) {
                console.error("Camera access failed:", err);
                alert("Could not access camera. Please check permissions.");
            }
        }

        initCamera();

        switchBtn.addEventListener('click', () => {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        });

        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Handle mirror flip for captured image if using front camera
            if (facingMode === 'user') {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // Update preview
            thumb.src = dataUrl;
            
            // Add to tray
            const item = document.createElement('div');
            item.className = 'captured-item';
            item.innerHTML = `
                <img src="${dataUrl}">
                <a href="${dataUrl}" download="tetron-capture-${Date.now()}.jpg" class="download-btn">
                    <i class="fas fa-download"></i>
                </a>
            `;
            tray.prepend(item);

            // Shutter effect
            video.style.opacity = '0.5';
            setTimeout(() => video.style.opacity = '1', 50);
        });
    </script>
</body>
</html>
