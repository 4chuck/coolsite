  <style>
    .login100-form-title { font-size: 28px; font-weight: 700; text-transform: capitalize; color:#fff; }
    .input100 { width:100%; padding:12px 40px; border-radius:6px; border:0px solid #ddd; color:#fff;  }

<body>
	
	<div class="limiter">
		<div class="container-login100" style="background-image: url('images/bg-01.jpg');">
			<div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-54" style="height: auto;">
					<span class="login100-form-title p-b-49">
                <p id="welcome-message"></p>
                <p id="error"></p>
                <h2>Create an Account</h2>
					</span>

					<div class="wrap-input100 m-b-23">
						<span class="label-input100">Username</span>
						<input class="input100" type="text" id="name" placeholder="Enter your username">
						<span class="focus-input100" data-symbol="&#xf206;"></span>
					</div><br>

          <div class="wrap-input100">
						<span class="label-input100">Email</span>
						<input class="input100" type="email" id="email" placeholder="Enter your Email">
						<span class="focus-input100" data-symbol="&#xf206;"></span>
					</div>
					<br>

					<div class="wrap-input100">
						<span class="label-input100">Password</span>
						<input class="input100" type="password" id="password" placeholder="Enter your password">
						<span class="focus-input100" data-symbol="&#xf190;"></span>
					</div><br>
					
					<div class="container-login100-form-btn">
						<div class="wrap-login100-form-btn">
							<div class="login100-form-bgbtn"></div>
                  <button class="login100-form-btn" id="signupBtn" type="button">signup</button>
						</div>
					</div>
					<div class="txt1 text-center p-t-54 p-b-20">
             			<a href="fire-login.html">Already have an account? Login</a><br>
            			<a href="../index.html">Back to Home</a><br>
					</div>
            <p style="font-size:12px; color:#ccc; margin-top:10px; text-align:center;">
            This site is protected by Google reCAPTCHA and<br> the
            <a href="https://policies.google.com/privacy" target="_blank">Privacy Policy</a> and
            <a href="https://policies.google.com/terms" target="_blank">Terms of Service</a> apply.
            </p>
			</div>
		</div>
	</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      updateProfile,
      setPersistence, 
      browserLocalPersistence, 
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getDatabase, ref, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app-check.js";
    import { firebaseConfig, appCheckSiteKey } from "../firebase/home/config.js";
    import { redirectTo } from "../firebase/home/routes.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    try {
      initializeAppCheck(app, {
        provider: new ReCaptchaV3Provider(appCheckSiteKey),
        isTokenAutoRefreshEnabled: true
      });
    } catch (err) {
      console.warn("App Check initialization failed:", err);
    }

    const signupBtn = document.getElementById("signupBtn");
    const welcomeMsg = document.getElementById("welcome-message");
    const errorMsg = document.getElementById("error");

    const getFirebaseErrorMessage = (errorCode) => {
      const errors = {
        "auth/email-already-in-use": "This email is already registered.",
        "auth/invalid-email": "Invalid email address.",
        "auth/weak-password": "Password is too weak.",
        "auth/network-request-failed": "Network error."
      };
      return errors[errorCode] || "An error occurred. Please try again.";
    };

    const showProcessing = (msg = "Processing...") => {
      errorMsg.style.display = "none";
      welcomeMsg.innerText = msg;
      welcomeMsg.style.display = "block";
    };

    const hideProcessing = () => { welcomeMsg.style.display = "none"; };
    const showError = (msg) => {
      hideProcessing();
      errorMsg.innerText = msg;
      errorMsg.style.display = "block";
    };

    async function saveUserData(user, name) {
      const userRef = ref(db, 'users/' + user.uid);
      return update(userRef, {
        uid: user.uid,
        email: user.email,
        displayName: name,
        createdAt: serverTimestamp(),
        role: "user"
      });
    }

    async function signup() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        showError("All fields are required.");
        return;
      }

      showProcessing("Verifying you are human...");
      signupBtn.disabled = true;

      grecaptcha.ready(() => {
        grecaptcha.execute("6Le7KT0sAAAAAPxH8HbrFQSvM1uia1jGlAOxXoyr", { action: "signup" })
          .then(async (token) => {
            try {
              const res = await fetch("https://us-central1-login-b6382.cloudfunctions.net/verifyRecaptcha", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token })
              });
              const result = await res.json();

              if (!result.success || result.score < 0.5) {
                showError("Suspicious activity detected. Please try again.");
                signupBtn.disabled = false;
                return;
              }

              await setPersistence(auth, browserLocalPersistence);
              const userCredential = await createUserWithEmailAndPassword(auth, email, password);
              const user = userCredential.user;

              await updateProfile(user, { displayName: name });
              
              localStorage.setItem('name', name);
              localStorage.setItem('userUID', user.uid);
              localStorage.setItem('email', user.email);

              await saveUserData(user, name);
              redirectTo('cyborgHome');
            } catch (err) {
              console.error("Signup error:", err);
              showError(getFirebaseErrorMessage(err.code));
              signupBtn.disabled = false;
            }
          });
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const firstName = (user.displayName || "Player").split(" ")[0];
        welcomeMsg.innerText = `Hello, ${firstName}`;
        welcomeMsg.style.display = "block";
      }
    });

    signupBtn.addEventListener("click", signup);
  </script>
